
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 - User Directory</title>
    <script src="users.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background: #f4f7f8;
            color: #222;
        }

        button, input {
            padding: 10px;
            margin: 5px 0;
            font: inherit;
        }

        button {
            cursor: pointer;
            background: #167d7f;
            color: white;
            border: 0;
            border-radius: 5px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #filter-input {
            width: 95%;
        }

        #status {
            padding: 10px 0;
        }

        #users-list {
            padding: 0;
            list-style: none;
        }

        .user-card {
            background: white;
            padding: 15px;
            margin: 12px 0;
            border-radius: 8px;
            border-left: 4px solid #167d7f;
        }

        .user-card p {
            margin: 6px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>User Directory</h1>
        <p>Load and search users from an API.</p>
    </header>

    <main>
        <section>
            <button id="load-users">Load Users</button>

            <label for="filter-input">Filter users by name</label>
            <input id="filter-input" type="text"
                   placeholder="Type a name...">

            <p id="status" role="status" aria-live="polite">
                Click Load Users to begin.
            </p>

            <ul id="users-list"></ul>
        </section>
    </main>

    <footer>
        <p>PLP Software Engineering - Day 5</p>
    </footer>
</body>
</html>
